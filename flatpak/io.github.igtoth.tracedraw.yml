app-id: io.github.igtoth.tracedraw
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: tracedraw
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
modules:
  - name: tracedraw
    buildsystem: simple
    build-commands:
      - install -Dm755 tracedraw /app/bin/tracedraw
      - install -Dm755 tracedraw-cli /app/bin/tracedraw-cli
      - install -Dm644 io.github.igtoth.tracedraw.desktop /app/share/applications/io.github.igtoth.tracedraw.desktop
      - install -Dm644 io.github.igtoth.tracedraw.png /app/share/icons/hicolor/256x256/apps/io.github.igtoth.tracedraw.png
      - install -Dm644 io.github.igtoth.tracedraw.metainfo.xml /app/share/metainfo/io.github.igtoth.tracedraw.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/igtoth/tracedraw/releases/download/v0.27.0/tracedraw-0.27.0-linux-x86_64.tar.gz
        sha256: ea62d8098e45512f860cb0437b0d9713829527d8c5a920eae9388808d1f10ebc
        strip-components: 0
      - type: file
        path: io.github.igtoth.tracedraw.desktop
      - type: file
        path: io.github.igtoth.tracedraw.png
      - type: file
        path: io.github.igtoth.tracedraw.metainfo.xml
