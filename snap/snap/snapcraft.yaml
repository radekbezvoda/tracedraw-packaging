name: tracedraw
title: TraceDraw
base: core24
version: '0.19.6'
summary: Vector illustration editor
description: |
  TraceDraw is an open-source vector illustration editor for Windows, macOS,
  Linux, and the browser. This snap repackages the official upstream Linux
  release. The headless command-line tool is available as tracedraw.cli.
license: MIT OR Apache-2.0
website: https://github.com/igtoth/tracedraw
source-code: https://github.com/igtoth/tracedraw
issues: https://github.com/igtoth/tracedraw/issues
contact: https://github.com/igtoth/tracedraw/issues
icon: snap/gui/tracedraw.png
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  tracedraw:
    command: bin/tracedraw
    extensions: [gnome]
    desktop: meta/gui/tracedraw.desktop
    common-id: io.github.igtoth.tracedraw
    plugs:
      - home
      - network
      - opengl
      - removable-media
  cli:
    command: bin/tracedraw-cli
    extensions: [gnome]
    plugs:
      - home
      - network
      - removable-media

parts:
  tracedraw:
    plugin: nil
    build-packages:
      - ca-certificates
      - curl
    stage-packages:
      - libvulkan1
      - libxkbcommon-x11-0
    override-pull: |
      set -eu
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          arch=x86_64
          sha256=234650571914bfdf24a2c33aa6c2bc3c681c55a008eadf8e92d83f117928d8ed
          ;;
        arm64)
          arch=arm64
          sha256=c961c5b3dfa8a04c8bffc4ddf03f55afd75f7e6339c30e79c41c2153d8391c1e
          ;;
        *)
          echo "unsupported architecture: $CRAFT_ARCH_BUILD_FOR" >&2
          exit 1
          ;;
      esac
      name="tracedraw-${CRAFT_PROJECT_VERSION}-linux-${arch}"
      url="https://github.com/igtoth/tracedraw/releases/download/v${CRAFT_PROJECT_VERSION}/${name}.tar.gz"
      curl -fsSL --retry 3 -o "${name}.tar.gz" "$url"
      printf '%s  %s.tar.gz\n' "$sha256" "$name" | sha256sum -c -
      tar xzf "${name}.tar.gz"
      rm -f "${name}.tar.gz"
    override-build: |
      set -eu
      install -Dm755 tracedraw "$CRAFT_PART_INSTALL/bin/tracedraw"
      install -Dm755 tracedraw-cli "$CRAFT_PART_INSTALL/bin/tracedraw-cli"
      install -Dm644 "$CRAFT_PROJECT_DIR/snap/gui/tracedraw.desktop" "$CRAFT_PART_INSTALL/meta/gui/tracedraw.desktop"
      install -Dm644 "$CRAFT_PROJECT_DIR/snap/gui/tracedraw.png" "$CRAFT_PART_INSTALL/meta/gui/tracedraw.png"
